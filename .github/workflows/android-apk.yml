name: Build FitPlan Android APK
# FitPlan MASTER API connected; APK loads the live Netlify PWA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'android/**', '.github/workflows/android-apk.yml' ]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Android launcher icons from FitPlan logo
        run: |
          set -e
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$d
            base64 -d app/src/main/fitplan_icon.b64 > app/src/main/res/mipmap-$d/ic_launcher.jpg
            cp app/src/main/res/mipmap-$d/ic_launcher.jpg app/src/main/res/mipmap-$d/ic_launcher_round.jpg
          done
      - run: gradle clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FitPlan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
