name: Build FitPlan Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'android/**', '.github/workflows/android-apk.yml' ]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore FitPlan launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app/src/main/fitplan_icon.b64 > app/src/main/res/drawable-nodpi/fitplan_icon.png
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FitPlan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
